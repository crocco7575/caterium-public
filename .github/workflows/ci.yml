name: Verify the public demo
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing -q
      - name: Verify migration cycle on disposable SQLite
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run python -m app.init_db
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: DEMO_ONLY_NOT_A_SECRET # pragma: allowlist secret -- fictional local fixture
          POSTGRES_DB: caterium_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d caterium_demo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://demo:DEMO_ONLY_NOT_A_SECRET@localhost:5432/caterium_demo_test # pragma: allowlist secret -- fictional local fixture
      DATABASE_URL: postgresql+psycopg://demo:DEMO_ONLY_NOT_A_SECRET@localhost:5432/caterium_demo_test # pragma: allowlist secret -- fictional local fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/publication_check.py
      - run: docker compose config --quiet
