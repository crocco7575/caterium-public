name: caterium-public
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caterium_demo}
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DEMO_ONLY_NOT_A_SECRET}
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-demo}:${POSTGRES_PASSWORD:-DEMO_ONLY_NOT_A_SECRET}@db:5432/${POSTGRES_DB:-caterium_demo}
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=2)']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    cpus: 1.0
  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1.0
volumes:
  demo-db:
